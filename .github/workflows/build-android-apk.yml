name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Initialize Capacitor Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Apply app icon to Android launcher resources
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            cp public/pwa-192x192.png android/app/src/main/res/$dir/ic_launcher.png
            cp public/pwa-192x192.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp public/pwa-maskable-512x512.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done
          if [ -f android/app/src/main/res/values/ic_launcher_background.xml ]; then
            sed -i 's/#[0-9A-Fa-f]\{6\}/#113224/g' android/app/src/main/res/values/ic_launcher_background.xml
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPE-Maths-Lecturer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
